<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickKart: groceries and essentials in about 10 minutes. A vanilla JavaScript storefront.">
  <meta name="theme-color" content="#fafaf8">
  <title>QuickKart · Groceries in minutes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23111%22/><circle cx=%2223%22 cy=%2223%22 r=%224%22 fill=%22%2316a34a%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://dummyjson.com">
  <link rel="preconnect" href="https://cdn.dummyjson.com">
</head>
<body>
  <div id="app">
    <a class="skip-link" href="#content">Skip to products</a>
    <header class="site-header" data-region="header"></header>
    <nav class="tabs-bar" data-region="aisles" aria-label="Aisles"></nav>

    <main id="content" class="container content" data-region="content" aria-live="polite"></main>

    <footer class="site-footer">
      <div class="container">
        <p>QuickKart is a demo storefront built with vanilla JavaScript. Product data: <a href="https://dummyjson.com" rel="noopener">DummyJSON</a>.</p>
      </div>
    </footer>

    <div class="modal-root" data-region="modal" hidden></div>
    <div class="backdrop" data-region="cart-backdrop" data-action="close-cart" hidden></div>
    <aside class="drawer" data-region="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title" hidden></aside>
    <div class="cart-bar-root" data-region="cart-bar" hidden></div>
    <div class="snackbar-root" data-region="snackbar" hidden></div>
    <div class="visually-hidden" data-region="announcer" aria-live="polite"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
